# Секреты Secure RAG.
#
# ВНИМАНИЕ: значения ниже — шаблон. Настоящие секреты создаются вне Git:
#   kubectl -n secure-rag create secret generic secure-rag-secrets \
#     --from-literal=audit-secret="$(openssl rand -hex 32)" \
#     --from-literal=auth-secret="$(openssl rand -hex 32)"
# или подключается HashiCorp Vault (External Secrets Operator / Vault Agent).
# Значения по умолчанию из INSECURE_AUDIT_SECRETS ("change_me",
# "fallback-secret-replace-in-production") приложение отвергает при старте.
apiVersion: v1
kind: Secret
metadata:
  name: secure-rag-secrets
  namespace: secure-rag
type: Opaque
stringData:
  audit-secret: "REPLACE_ME_run_kubectl_create_secret"
  auth-secret: "REPLACE_ME_run_kubectl_create_secret"
